<!DOCTYPE html>
<html lang="en">

      SmarTech Solutions - Cloud Inventory

    </script>

    <style>
      :root {
            --primary: #1e293b;
            --primary-dark: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --light-bg: #f8fafc;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #334155;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* Status Bar */
        .firebase-status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .status-pill { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
        .status-dot { width: 9px; height: 9px; border-radius: 50%; background-color: #94a3b8; }
        .status-dot.connected { background-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
        .status-dot.syncing { background-color: #3b82f6; animation: pulse-dot 1s infinite alternate; }
        @keyframes pulse-dot { from { opacity: 0.4; } to { opacity: 1; } }

        /* Navigation */
        .nav-tabs { display: flex; gap: 8px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
        .tab-btn {
            padding: 10px 20px;
            background: #e2e8f0;
            border: none;
            border-radius: 6px 6px 0 0;
            font-weight: 600;
            cursor: pointer;
            color: #64748b;
            transition: all 0.15s;
        }
        .tab-btn.active { background: var(--accent); color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Shop Header */
        .shop-header {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shop-info h1 { margin: 0; color: var(--primary); font-size: 24px; }
        .shop-info p { margin: 2px 0; font-size: 13px; color: #64748b; }
        
        .shop-logo-img {
            max-height: 65px;
            max-width: 170px;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 4px;
        }

        /* Forms & Tables */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
            background: var(--light-bg);
            padding: 14px;
            border-radius: 6px;
        }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-weight: 600; font-size: 11px; text-transform: uppercase; color: #64748b; }
        .form-group input { padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-family: inherit; }

        .search-select-section {
            margin-bottom: 20px;
            background: #eff6ff;
            padding: 15px;
            border-radius: 6px;
            border: 1px dashed #bfdbfe;
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
        }
        .search-select-section input { flex-grow: 1; padding: 9px; border: 1px solid var(--border); border-radius: 4px; }

        .search-dropdown {
            position: absolute;
            top: 100%; left: 0; right: 0;
            background: white;
            border: 1px solid var(--border);
            max-height: 250px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }
        .search-dropdown.show { display: block; }
        .search-dropdown-item {
            padding: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #f1f5f9;
        }
        .search-dropdown-item:hover { background: #f0f7ff; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th { background: var(--primary); color: white; padding: 10px; font-size: 12px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }

        /* Dedicated Image Box - Ensures High-Res & Zero Stretch */
        .thumb-box {
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            max-width: 44px;
            max-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
            padding: 2px;
            box-sizing: border-box;
        }

        .table-thumb { 
            max-width: 100%; 
            max-height: 100%; 
            width: auto; 
            height: auto; 
            object-fit: contain; 
            display: block;
            margin: auto;
        }

        .item-cell-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #tableBody input {
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: inherit;
            color: #334155;
        }

        /* Inventory Manager */
        .inv-form-container { background: var(--light-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
        .inv-form { display: grid; grid-template-columns: 2fr 1fr 1.5fr; gap: 10px; }
        .image-upload-zone { grid-column: span 3; border: 2px dashed #cbd5e1; padding: 15px; text-align: center; border-radius: 8px; position: relative; background: #fff; }

        /* View All List */
        .viewall-row {
            display: grid; grid-template-columns: 60px 1fr 150px 150px 120px;
            align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid var(--border);
        }
        .qty-stepper { display: inline-flex; align-items: center; gap: 5px; background: #f1f5f9; padding: 4px; border-radius: 4px; }
        .qty-stepper button { width: 24px; height: 24px; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .qty-minus { background: #fee2e2; color: #b91c1c; }
        .qty-plus { background: #dcfce7; color: #166534; }

        /* Buttons */
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-add { background: #10b981; color: white; }
        .btn-print { background: var(--accent); color: white; }
        .btn-delete { background: #ef4444; color: white; }
        .btn-edit { background: #f59e0b; color: white; }
        .btn-outline { background: white; border: 1px solid var(--border); }

        .spinner {
            width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Print Page Frame (hidden on screen) */
        .print-page-frame {
            display: none;
        }

        /* PRINT / PDF STYLES */
        @media print {
            @page {
                size: A4 portrait;
                margin: 8mm;
            }

            .print-page-frame {
                display: block !important;
                position: fixed;
                inset: 0;
                border: 1.5px solid #1e293b;
                pointer-events: none;
                z-index: 99999;
                box-sizing: border-box;
            }

            .no-print, .firebase-status-bar, .nav-tabs, .search-select-section { display: none !important; }

                padding: 10px 14px !important; 
                margin: 0 !important;
                background: white !important; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }
            .container { 
                box-shadow: none !important; 
                max-width: 100% !important; 
                padding: 0 !important; 
                margin: 0 !important;
            }

            }

            .details-grid input,

            input[type="date"],
            input[type="number"] {

                outline: none !important;
                box-shadow: none !important;
                background: transparent !important;
                padding: 0 !important;
                margin: 0 !important;

                font-size: 13px;
                color: #000 !important;

                display: none !important;
                -webkit-appearance: none !important;
                opacity: 0 !important;
                pointer-events: none !important;
                width: 0 !important;
                margin: 0 !important;
                padding: 0 !important;

            input[type="date"]::-webkit-datetime-edit,

            input[type="date"]::-webkit-datetime-edit-text,
            input[type="date"]::-webkit-datetime-edit-month-field,
            input[type="date"]::-webkit-datetime-edit-day-field,

            table { width: 100%; border-collapse: collapse; }

                align-items: center !important;
                gap: 8px !important;
            }

            }

                width: auto !important;
                height: auto !important;
                object-fit: contain !important;

  </head>

    // ==========================================
    // 2. INITIALIZATION
    // ==========================================
    window.onload = () => {
        firebase.initializeApp(fbConfig);
        db = firebase.firestore();
        updateStatus('syncing', 'Connecting to Firestore...');
        
        db.collection('inventory').onSnapshot(snap => {
            inventory = [];
            snap.forEach(doc => inventory.push({id: doc.id, ...doc.data()}));
            inventory.sort((a,b) => a.name.localeCompare(b.name));
            refreshUI();
            updateStatus('connected', `Live: ${inventory.length} items`);
        }, err => {
            updateStatus('local', 'Offline Mode Active');
            console.error(err);
        });

        addRow();
        document.getElementById('estDate').valueAsDate = new Date();
        setupSearch();
    };

    function updateStatus(cls, txt) {
        const dot = document.getElementById('fbDot');
        dot.className = 'status-dot ' + cls;
        document.getElementById('fbText').textContent = txt;
    }

    // ==========================================
    // 3. INVENTORY LOGIC (CRUD)
    // ==========================================
    let curBase64 = defImg;

    async function handleImg(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (re) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                // High-resolution constraint (max 600px retains full detail for PDF without blurring)
                const maxDim = 600;
                let w = img.width;
                let h = img.height;

                if (w > maxDim || h > maxDim) {
                    if (w > h) {
                        h = Math.round((h * maxDim) / w);
                        w = maxDim;
                    } else {
                        w = Math.round((w * maxDim) / h);
                        h = maxDim;
                    }
                }

                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');

                // High quality bicubic resampling
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';

                // Fill white background to avoid dark transparent areas
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, w, h);
                ctx.drawImage(img, 0, 0, w, h);

                // High quality encoding
                curBase64 = canvas.toDataURL('image/jpeg', 0.92);
                
                const preview = document.getElementById('imgPrev');
                preview.src = curBase64;
                preview.style.display = 'block';
            };
            img.src = re.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function saveInvItem() {
        const name = document.getElementById('invName').value.trim();
        const qty = document.getElementById('invQty').value;
        const brand = document.getElementById('invBrand').value;
        const id = document.getElementById('invEditId').value || Date.now().toString();

        if(!name) return alert('Enter Name');

        const btn = document.getElementById('btnSaveInv');
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving...';

        try {
            await db.collection('inventory').doc(id).set({
                name, qty, brand, img: curBase64, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            resetInvForm();
        } catch (e) { alert(e.message); }
        btn.disabled = false; btn.innerHTML = 'Save to Cloud';
    }

    async function delItem(id) {
        if(confirm('Delete from Cloud?')) await db.collection('inventory').doc(id).delete();
    }

    function editItem(id) {
        const item = inventory.find(i => i.id === id);
        if(!item) return;
        document.getElementById('invEditId').value = item.id;
        document.getElementById('invName').value = item.name;
        document.getElementById('invQty').value = item.qty;
        document.getElementById('invBrand').value = item.brand;
        curBase64 = item.img;
        document.getElementById('imgPrev').src = curBase64;
        document.getElementById('imgPrev').style.display = 'block';
        switchTab('inventoryTab', document.querySelectorAll('.tab-btn')[1]);
    }

    function resetInvForm() {
        document.getElementById('invEditId').value = '';
        document.getElementById('invName').value = '';
        document.getElementById('invQty').value = '1';
        document.getElementById('invBrand').value = '';
        document.getElementById('imgPrev').style.display = 'none';
        curBase64 = defImg;
    }

    // ==========================================
    // 4. UI RENDERING & COUNTER SYNC
    // ==========================================
    function refreshUI() {
        renderInventory();
        renderViewAll();
    }

    function renderInventory() {
        const body = document.getElementById('inventoryTableBody');
        body.innerHTML = inventory.map(i => `
            <tr>
                <td>
                    <div class="thumb-box">
                        <img src="${i.img}" class="table-thumb" onerror="this.src='${defImg}'" alt="">
                    </div>
                </td>
                <td><strong>${i.name}</strong></td>
                <td>${i.qty}</td>
                <td>${i.brand}</td>
                <td style="text-align:right;">
                    <button class="btn btn-edit" onclick="editItem('${i.id}')">Edit</button>
                    <button class="btn btn-delete" onclick="delItem('${i.id}')">✕</button>
                </td>
            </tr>
        `).join('');
    }

    function getItemEstimateQty(itemName) {
        const row = findRowByName(itemName);
        if(!row) return 0;
        const val = parseFloat(row.querySelector('.i-qty').value);
        return isNaN(val) ? 0 : val;
    }

    function syncViewAllCounters() {
        inventory.forEach(i => {
            const span = document.getElementById(`q-${i.id}`);
            if(span) {
                span.textContent = getItemEstimateQty(i.name);
            }
        });
    }

    function renderViewAll() {
        const q = document.getElementById('vaSearch').value.toLowerCase();
        const body = document.getElementById('viewAllBody');
        const items = inventory.filter(i => i.name.toLowerCase().includes(q));

        body.innerHTML = items.map(i => {
            const curQty = getItemEstimateQty(i.name);
            return `
            <div class="viewall-row">
                <div class="thumb-box">
                    <img src="${i.img}" class="table-thumb" onerror="this.src='${defImg}'" alt="">
                </div>
                <div style="font-weight:bold;">${i.name}</div>
                <div class="qty-stepper">
                    <button class="qty-minus" onclick="updateEst('${escapeQuotes(i.name)}', -1)">−</button>
                    <span id="q-${i.id}">${curQty}</span>
                    <button class="qty-plus" onclick="updateEst('${escapeQuotes(i.name)}', 1, '${escapeQuotes(i.brand)}', '${escapeQuotes(i.img)}')">+</button>
                </div>
                <div style="color:#64748b;">${i.brand}</div>
                <button class="btn btn-add" onclick="addFromList('${escapeQuotes(i.name)}', '${i.qty}', '${escapeQuotes(i.brand)}', '${escapeQuotes(i.img)}')">Add</button>
            </div>
            `;
        }).join('');
    }

    function escapeQuotes(str) {
        if (!str) return '';
        return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // ==========================================
    // 5. ESTIMATE LOGIC & DEDUPLICATION
    // ==========================================
    function findRowByName(name) {
        if (!name) return null;
        const rows = document.querySelectorAll('#tableBody tr');
        const target = name.trim().toLowerCase();
        for(let r of rows) {
            const input = r.querySelector('.i-name');
            if(input && input.value.trim().toLowerCase() === target) {
                return r;
            }
        }
        return null;
    }

    function addRow(name='', qty='1', brand='', img=defImg) {
        const body = document.getElementById('tableBody');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="sl"></td>
            <td><div class="item-cell-wrapper">
                <div class="thumb-box">
                    <img src="${img}" class="table-thumb" onerror="this.src='${defImg}'" alt="">
                </div>
                <input type="text" value="${name}" class="i-name" style="width:100%;" onchange="lookup(this); syncViewAllCounters();">
            </div></td>
            <td><input type="number" step="any" value="${qty}" class="i-qty" style="width:80px;" oninput="syncViewAllCounters()"></td>
            <td><input type="text" value="${brand}" class="i-brand" style="width:100%;"></td>
            <td class="no-print"><button class="btn-delete" onclick="this.closest('tr').remove(); renIdx(); syncViewAllCounters();">✕</button></td>
        `;
        body.appendChild(row);
        renIdx();
    }

    function renIdx() {
        document.querySelectorAll('.sl').forEach((td, i) => td.textContent = i + 1);
    }

    function lookup(el) {
        const item = inventory.find(i => i.name.toLowerCase() === el.value.trim().toLowerCase());
        if(item) {
            const tr = el.closest('tr');
            tr.querySelector('img').src = item.img;
            tr.querySelector('.i-qty').value = item.qty;
            tr.querySelector('.i-brand').value = item.brand;
        }
    }

    function addFromList(n, q, b, i) {
        const existingRow = findRowByName(n);
        const addAmount = parseFloat(q) || 1;
        
        if (existingRow) {
            const qtyInput = existingRow.querySelector('.i-qty');
            const currentVal = parseFloat(qtyInput.value) || 0;
            qtyInput.value = currentVal + addAmount;
        } else {
            const rows = document.querySelectorAll('#tableBody tr');
            let reused = false;
            for(let r of rows) {
                const nameInput = r.querySelector('.i-name');
                if(nameInput && nameInput.value.trim() === '') {
                    nameInput.value = n;
                    r.querySelector('img').src = i || defImg;
                    r.querySelector('.i-qty').value = addAmount;
                    r.querySelector('.i-brand').value = b || '';
                    reused = true;
                    break;
                }
            }
            if(!reused) {
                addRow(n, addAmount, b, i);
            }
        }
        
        syncViewAllCounters();
        showToast(`Updated "${n}" in Estimate`);
    }

    function updateEst(name, change, brand='', img=defImg) {
        const existingRow = findRowByName(name);
        
        if (existingRow) {
            const qtyInput = existingRow.querySelector('.i-qty');
            const newQty = (parseFloat(qtyInput.value) || 0) + change;
            if (newQty <= 0) {
                existingRow.remove();
                renIdx();
            } else {
                qtyInput.value = newQty;
            }
        } else if (change > 0) {
            addFromList(name, change, brand, img);
        }
        
        syncViewAllCounters();
    }

    function setupSearch() {
        const input = document.getElementById('itemSearchInput');
        const dd = document.getElementById('searchDropdown');
        
        input.oninput = () => {
            const val = input.value.toLowerCase().trim();
            if(!val) return dd.classList.remove('show');
            const match = inventory.filter(i => i.name.toLowerCase().includes(val)).slice(0,8);
            dd.innerHTML = match.map(i => `
                <div class="search-dropdown-item" onclick="addFromList('${escapeQuotes(i.name)}','${i.qty}','${escapeQuotes(i.brand)}','${escapeQuotes(i.img)}'); document.getElementById('itemSearchInput').value=''; document.getElementById('searchDropdown').classList.remove('show');">
                    <div class="thumb-box" style="width:34px; height:34px; min-width:34px; min-height:34px;">
                        <img src="${i.img}" class="table-thumb" onerror="this.src='${defImg}'" alt="">
                    </div>
                    <span>${i.name} (${i.brand || 'General'})</span>
                </div>
            `).join('');
            dd.classList.add('show');
        };
    }

    async function syncLocalToFirestore() {
        if(!confirm(`Upload ${seedData.length} items to your Cloud Database?`)) return;
        const btn = document.getElementById('btnSync');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Uploading...';
        
        try {
            const batch = db.batch();
            for(let item of seedData) {
                const docRef = db.collection('inventory').doc(item.id.toString());
                batch.set(docRef, {
                    name: item.name,
                    qty: item.qty,
                    brand: item.brand,
                    img: item.img,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
            await batch.commit();
            alert(`Successfully uploaded ${seedData.length} items to Firestore!`);
            btn.style.display = 'none';
        } catch(e) {
            alert('Error syncing to Firestore: ' + e.message);
            btn.disabled = false;
            btn.innerHTML = '☁️ Upload Seed to Cloud';
        }
    }

    function switchTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        if (id === 'viewAllTab') {
            syncViewAllCounters();
        }
    }

    function showToast(m) {
        const t = document.createElement('div');
        t.style = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 20px; border-radius:5px; z-index:9999;";
        t.textContent = m;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
    }
    </script>
  </body>
</html>
